<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#64B5F6"/>
      <stop offset="50%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>

  <!-- One UI 7 rounded square icon mask -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Cloud: 3-circle composition (iCloud-inspired, unique proportions) -->
  <circle cx="185" cy="275" r="80" fill="white" opacity="0.97"/>
  <circle cx="327" cy="265" r="90" fill="white" opacity="0.97"/>
  <ellipse cx="260" cy="305" rx="130" ry="52" fill="white" opacity="0.97"/>

  <!-- Upload arrow (drive metaphor, blue to contrast white cloud) -->
  <g transform="translate(268, 248)">
    <rect x="-8" y="-4" width="16" height="36" rx="3" fill="#2196F3"/>
    <polygon points="-22,-2 0,-26 22,-2" fill="#2196F3"/>
  </g>
</svg>
