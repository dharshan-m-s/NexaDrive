name: nexadrive
description: NexaDrive private cloud client.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  http: ^1.2.2
  file_picker: ^13.0.0
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  workmanager: ^0.10.9
  camera: ^0.12.1
  pdfx: ^2.11.0
  audioplayers: ^6.8.1
  video_player: ^2.14.0
  video_player_android: ^2.12.2
  pdf: ^3.13.0
  image: ^4.9.2
  # 10.x: AGP 9+ (the pinned Android Gradle Plugin) rejects plugins that
  # apply the explicit `kotlin-android` plugin; 8.x/9.x do, 10.x does not.
  package_info_plus: ^10.2.1
  # ZIP payloads for the Windows portable update flow.
  archive: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
