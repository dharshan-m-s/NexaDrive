name: nexadrive
description: NexaDrive private cloud client.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  http: ^1.2.2
  file_picker: ^13.1.0
  # Retained on 10.x: 11.x raises Android minSdk and changes secure-storage
  # key handling, which can invalidate the session token already written on
  # installed devices. Revisit with an on-device credential-migration test.
  flutter_secure_storage: ^10.3.4
  path_provider: ^2.1.6
  # Path arithmetic for the folder uploader (relative paths inside a picked
  # folder, and the destination folder on the server).
  path: ^1.9.0
  shared_preferences: ^2.5.6
  uuid: ^4.5.1
  workmanager: ^0.10.10
  camera: ^0.12.1
  pdfx: ^2.11.0
  audioplayers: ^6.8.1
  video_player: ^2.14.1
  video_player_android: ^2.12.2
  pdf: ^3.13.1
  image: ^4.12.0
  # 10.x: AGP 9+ (the pinned Android Gradle Plugin) rejects plugins that
  # apply the explicit `kotlin-android` plugin; 8.x/9.x do, 10.x does not.
  package_info_plus: ^10.2.2
  # ZIP payloads for the Windows portable update flow.
  archive: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
