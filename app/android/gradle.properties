org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 8.11.1 (pinned in settings.gradle.kts) has no built-in Kotlin compiler, so
# plugins such as pdfx 2.11.0 must apply the explicit `kotlin-android` plugin.
# `android.builtInKotlin=true` makes pdfx skip that and wait for AGP 9's built-in
# Kotlin, leaving io.scer.pdfx.PdfxPlugin uncompiled and breaking
# GeneratedPluginRegistrant.javac on `package io.scer.pdfx does not exist`.
android.builtInKotlin=false
