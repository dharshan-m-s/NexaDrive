name: nexa_foreground_service
description: Native registration for NexaDrive's Android transfer foreground service.
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.nexadrive.foreground
        pluginClass: ForegroundTransferPlugin
