name: Temporary login formatter

on:
  push:
    branches: [beta]
    paths:
      - 'app/lib/ui/screens/login/login_screen.dart'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Format the login screen
        working-directory: app
        run: |
          flutter pub get
          dart format lib/ui/screens/login/login_screen.dart
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/ui/screens/login/login_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m "Apply Dart formatter to responsive login layout"
            git push origin HEAD:beta
          fi
