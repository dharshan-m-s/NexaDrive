name: Temporary Dart formatter repair

on:
  push:
    branches: [beta]
    paths:
      - 'app/**/*.dart'

permissions:
  contents: write

jobs:
  format-and-verify:
    if: "!contains(github.event.head_commit.message, '[formatter cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Format Dart sources
        working-directory: app
        run: |
          flutter pub get
          dart format lib test integration_test
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin beta
            git rebase origin/beta
            (cd app && dart format lib test integration_test)
            git add app/lib app/test app/integration_test
            if ! git diff --cached --quiet; then
              git commit -m "Apply Dart formatter to redesigned UI"
            fi
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/beta)" ]; then
              echo "Dart sources are formatted and beta is up to date."
              break
            fi
            if git push origin HEAD:beta; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not push formatter commit after three retries."
              exit 1
            fi
          done
      - name: Analyze formatted source
        working-directory: app
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: app
        run: flutter test
