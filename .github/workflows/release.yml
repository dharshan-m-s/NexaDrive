name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: |
          Version to release — MAJOR.MINOR.PATCH[-prerelease][+N].
          Examples: 1.6.0, 1.7.0-rc.1, 1.7.0+24.
          +N is the Android build number / versionCode. Prereleases MUST set
          +N explicitly so their versionCode cannot collide with the final
          release (e.g. 1.7.0-rc.1+24).
        required: true
        type: string
      prerelease:
        description: |
          Publish as a GitHub prerelease (hidden from /releases/latest and
          ignored by the in-app auto-updater). Must be checked when the version
          has a -prerelease suffix, and unchecked otherwise.
        required: false
        type: boolean
        default: false
      publish_release:
        description: |
          Create the tag + GitHub Release and publish the update manifest.
          Disable to compile every artifact as a test: nothing is published
          and a production keystore is not required (debug-signed APK).
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.2"

# Third-party actions are pinned to full commit SHAs (resolved from the tagged
# release of each action); the human-readable tag is kept in a trailing comment.
# Expected artifacts for version X.Y.Z:
#   NexaDrive-X.Y.Z-server-linux-x86_64, -aarch64, .apk,
#   -linux-x86_64.AppImage, -linux-amd64.deb, -windows-x64.zip,
#   -windows-x64-setup.exe  + nexadrive-update-manifest.json + SHA256SUMS.txt
#
# The version is chosen on the Actions page ("Run workflow") BEFORE anything
# is compiled — the user types it into the release form; there is no tag-push
# trigger and no in-app version prompt. The tag v<version> is created by the
# release step, never exported by pushing a tag.
#
# A real release (publish_release=true) must ship a PRODUCTION-signed APK: an
# APK signed with a different key cannot install as an upgrade, so a release
# without KEYSTORE_BASE64 is refused. publish_release=false runs a test build
# that only uploads workflow artifacts (debug-signed APK).
# Only publish_release=true generates the update manifest and a GitHub release.
# Client binaries are compiled with NEXADRIVE_UPDATE_REPO=dharshan-m-s/NexaDrive
# baked in. The +N build suffix is an Android build number only — it never
# appears in the tag, the manifest, or cross-platform version strings.

jobs:
  version:
    name: Compute release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      build_number: ${{ steps.compute.outputs.build_number }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
    steps:
      - id: compute
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          [ -n "$VERSION_INPUT" ] || {
            echo "::error::version is empty — enter MAJOR.MINOR.PATCH[-prerelease][+N], e.g. 1.6.0."
            exit 1
          }
          core="${VERSION_INPUT%%+*}"
          core="${core#v}"
          [[ "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::'$VERSION_INPUT' is not valid SemVer (MAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          }
          case "$core" in
            *-*)
              [ "$PRERELEASE" = "true" ] || {
                echo "::error::version has a -prerelease suffix; tick the 'Publish as a GitHub prerelease' checkbox too."
                exit 1
              }
              ;;
            *)
              [ "$PRERELEASE" = "false" ] || {
                echo "::error::the 'Publish as a GitHub prerelease' checkbox is ticked but the version has no -prerelease suffix."
                exit 1
              }
              ;;
          esac
          build_number=""
          [[ "$VERSION_INPUT" =~ \+([0-9]+)$ ]] && build_number="${BASH_REMATCH[1]}"
          if [ -z "$build_number" ]; then
            IFS='.' read -r major minor rest <<< "$core"
            patch="${rest%%-*}"
            build_number=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
            if [ "$PRERELEASE" = "true" ]; then
              echo "::error::a prerelease needs an explicit +<build> number (e.g. 1.7.0-rc.1+24) so its Android versionCode cannot collide with the final release."
              exit 1
            fi
          fi
          echo "version=$core" >> "$GITHUB_OUTPUT"
          echo "tag=v$core" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing v$core (build number $build_number, prerelease=$PRERELEASE)."
      - name: Fail fast if this release/tag already exists
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.compute.outputs.tag }}"
          if gh api "repos/${{ github.repository }}/releases/tags/$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists on GitHub — enter a newer version."
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists on GitHub — enter a newer version."
            exit 1
          fi
          echo "Tag $tag is free — proceeding to build."

  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.6.x
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.13
        with:
          config_path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No runtime .env committed
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$' -q; then
            echo "::error::A runtime .env file is tracked by git. Remove it."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.98.1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Rust checks
        working-directory: server
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Flutter checks
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  server-linux-x64:
    name: Server binary (x86_64 Linux)
    runs-on: ubuntu-latest
    needs: [verify, version]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.6.x
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.98.1
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - run: cargo build --release --locked
        working-directory: server
      - name: Stage artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp server/target/release/nexadrive-server \
            "dist/NexaDrive-$VERSION-server-linux-x86_64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.9.3
        with:
          name: server-linux-x86_64
          path: dist/
          if-no-files-found: error

  server-linux-arm64:
    name: Server binary (aarch64 Linux)
    runs-on: ubuntu-latest
    needs: [verify, version]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.6.x
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.98.1
        with:
          toolchain: 1.98.1
      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.29.0
        with:
          target: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
          key: "aarch64"
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
        working-directory: server
      - name: Stage artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp server/target/aarch64-unknown-linux-gnu/release/nexadrive-server \
            "dist/NexaDrive-$VERSION-server-linux-aarch64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.9.3
        with:
          name: server-linux-aarch64
          path: dist/
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [verify, version]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.6.x
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Restore signing keystore, or refuse/debug-fallback
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > app/android/nexadrive-release.jks
            chmod 600 app/android/nexadrive-release.jks
            printf 'storeFile=nexadrive-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > app/android/key.properties
            chmod 600 app/android/key.properties
            keytool -list -keystore app/android/nexadrive-release.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "Signed release build enabled."
          elif [ "$PUBLISH_RELEASE" = "true" ]; then
            # Android update safety: an APK signed with a different key than
            # the installed one can never install as an upgrade, so a real
            # release without the production keystore must not ship.
            echo "::error::KEYSTORE_BASE64 is not set; refusing to build an unsigned release APK."
            exit 1
          else
            echo "::warning::No KEYSTORE_BASE64 secret set; test build is signed with the Flutter debug key (not installable over a signed release)."
          fi
      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name="${{ needs.version.outputs.version }}" \
            --build-number="${{ needs.version.outputs.build_number }}" \
            --dart-define=NEXADRIVE_UPDATE_REPO=dharshan-m-s/NexaDrive
      - name: Stage artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk \
            "dist/NexaDrive-$VERSION.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.9.3
        with:
          name: android
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux desktop (AppImage + deb)
    runs-on: ubuntu-latest
    needs: [verify, version]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.6.x
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev
      - run: flutter pub get
        working-directory: app
      - run: |
          flutter build linux --release \
            --build-name="${{ needs.version.outputs.version }}" \
            --build-number="${{ needs.version.outputs.build_number }}" \
            --dart-define=NEXADRIVE_UPDATE_REPO=dharshan-m-s/NexaDrive
        working-directory: app
      - name: Package AppImage and deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/package-linux.sh "$VERSION" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.9.3
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows desktop (ZIP + installer)
    runs-on: windows-latest
    needs: [verify, version]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.6.x
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
        working-directory: app
      - name: Build Windows release
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name="${{ needs.version.outputs.version }}" `
            --build-number="${{ needs.version.outputs.build_number }}" `
            --dart-define=NEXADRIVE_UPDATE_REPO=dharshan-m-s/NexaDrive
      - name: Stage portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "app\build\windows\x64\runner\Release\*" `
            -DestinationPath "dist\NexaDrive-$env:VERSION-windows-x64.zip"
      - name: Build Inno Setup installer
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          choco install innosetup --yes --no-progress
          $isscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $isscc "/DMyAppVersion=$env:VERSION" "app\windows\installer\nexadrive.iss"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.9.3
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  checksums-and-release:
    name: Checksums, manifest, and GitHub release
    runs-on: ubuntu-latest
    needs: [server-linux-x64, server-linux-arm64, android, linux, windows, version]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.6.x
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.4.5
        with:
          path: dist
          merge-multiple: true
      - name: List and checksum platform artifacts
        working-directory: dist
        run: |
          ls -lh
          # SHA256SUMS.txt intentionally excludes nexadrive-update-manifest.json:
          # the finalize step merges real release notes back into that file and
          # re-uploads it, which would leave a stale digest in the checksum list.
          # The manifest is self-verifying (verify-update-manifest.py re-checks
          # every embedded URL/digest against disk, before and after finalize).
          sha256sum NexaDrive-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Re-verify every artifact against SHA256SUMS.txt
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS.txt
      - name: Generate the update manifest (real releases only)
        if: ${{ inputs.publish_release }}
        env:
          RELEASE_PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
          VERSION: ${{ needs.version.outputs.version }}
          NEXADRIVE_RELEASE_REPO: dharshan-m-s/NexaDrive
        run: |
          set -euo pipefail
          # The client warns when the connected server is older than the
          # released server version, and reports the server's API contract.
          # Both are derived from source so they cannot drift from the build.
          export NEXADRIVE_MIN_SERVER_VERSION="$VERSION"
          export NEXADRIVE_SERVER_API_VERSION="$(sed -n 's/.*const API_VERSION: &str = "\([^"]*\)";.*/\1/p' server/src/main.rs)"
          # Structured release notes for the Update Center are generated by
          # the GitHub release itself; the manifest is refreshed with them in
          # the finalize step below so the client renders sections instead of
          # raw markdown.
          scripts/update-manifest.sh "$VERSION" "${RELEASE_PRERELEASE:-0}" dist
      - name: Fail if the manifest references a missing artifact
        if: ${{ inputs.publish_release }}
        run: |
          export GITHUB_REF_NAME="v${{ needs.version.outputs.version }}"
          python3 scripts/verify-update-manifest.py dist/nexadrive-update-manifest.json
      - name: Create GitHub release (real releases only)
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.0
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: NexaDrive ${{ needs.version.outputs.tag }}
          files: dist/*
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## NexaDrive ${{ needs.version.outputs.tag }}

            Pre-built binaries for Android, Windows, and Linux (x86_64 + aarch64 server).

            - `NexaDrive-<ver>.apk` — Android client, signed with the project keystore
              (releases refuse to ship without it).
            - `*windows-x64-setup.exe` — Inno Setup installer.
            - `*windows-x64.zip` — portable Windows bundle.
            - `*-linux-x86_64.AppImage` / `*-linux-amd64.deb` — Linux desktop client.
            - `*server-linux-x86_64` / `*server-linux-aarch64` — self-hosted server binary.
            - `nexadrive-update-manifest.json` — machine-readable metadata the app's
              Update Center consumes (versions, notes, URLs, SHA-256, sizes).
            - `SHA256SUMS.txt` — checksums for every platform artifact (the
              manifest is excluded: it is re-uploaded by the finalize step after
              release notes are merged, so its digest is never frozen in the list).

            Verify a download with `sha256sum -c SHA256SUMS.txt`.

            The in-app Update Center downloads and verifies updates automatically.
      - name: Finalize manifest release notes
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          scripts/finalize-update-manifest.sh "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_REPO"

      - name: Notify update clients (fail-open)
        if: ${{ inputs.publish_release }}
        continue-on-error: true
        run: |
          # Warm the release CDN and give the redirect under
          # /releases/latest/download/ time to propagate. The client tolerates
          # a brief window where the manifest 404s (shows its cached copy).
          sleep 10
          curl -fsSLI -o /dev/null \
            "https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/nexadrive-update-manifest.json" \
            || echo "::warning::Manifest asset not reachable yet (propagation delay)."